---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="meta"><a href="/blog">Blog</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
    <h1>{{ page.title }}</h1>
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <p class="back-link"><a href="/blog">← All posts</a></p>
</article>
